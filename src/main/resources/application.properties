# ===================================================
# Server
# ===================================================
server.port=${PORT:${SERVER_PORT:8081}}

# ===================================================
# MongoDB
# ===================================================
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=selfhealing_db

# ===================================================
# JWT
# ===================================================
# Secret key for signing JWT tokens. Must be at least 256 bits (32 chars).
# Set this via environment variable — never hardcode in source.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ===================================================
# AES Encryption (for storing GitHub PATs)
# ===================================================
# 32-character Base64-encoded AES-256 key.
# Generate with: openssl rand -base64 32
app.encryption.key=${ENCRYPTION_KEY}

# ===================================================
# Gemini AI
# ===================================================
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-2.5-flash
app.gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# ===================================================
# AI Provider Selection (gemini | ollama)
# ===================================================
app.ai.provider=gemini

# ===================================================
# Healing Engine
# ===================================================
# Maximum number of AI fix attempts per failing CI run
app.healing.max-attempts=3

# How long (in seconds) to wait between GitHub Actions polling checks
app.healing.poll-interval-seconds=30

# Maximum time (in minutes) to wait for a CI run to complete
app.healing.ci-timeout-minutes=15

# Callback secret — must match the X-Healer-Secret header from GitHub Actions
app.healing.callback-secret=${HEALER_CALLBACK_SECRET}

# ===================================================
# Async Thread Pool
# ===================================================
app.async.core-pool-size=5
app.async.max-pool-size=10
app.async.queue-capacity=25

# ===================================================
# Logging
# ===================================================
logging.level.com.selfhealing=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
